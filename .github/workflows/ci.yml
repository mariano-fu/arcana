name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # The repo is public: no real Tailscale node or tailnet names, only <host>.<tailnet>.ts.net.
      - run: .github/scripts/check-hostnames.sh
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # src/sync/api.gen.ts is generated from the committed api/openapi.yaml.
      - run: npm run gen:api-types && git diff --exit-code -- src/sync/api.gen.ts
      - run: npm run build

  # Playwright on WebKit with an iPhone profile against the production build (T1.15). Not a
  # required check: making it one means updating main's branch protection (Mariano's call).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # A required check on main, with web: renaming this job means updating the branch protection.
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arcana
          POSTGRES_PASSWORD: arcana
          POSTGRES_DB: arcana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://arcana:arcana@localhost:5432/arcana
      # JWTs are HMAC-SHA256 signed with it; PyJWT warns (an error under pytest) below 32 bytes.
      SECRET_KEY: ci-only-not-a-real-secret-at-least-32-bytes
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: api
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py spectacular --validate --fail-on-warn --file openapi.yaml && git diff --exit-code -- openapi.yaml
      - run: uv run pytest
      - run: docker build -t arcana-api:ci .

  # Builds and starts the whole deployed stack (deploy/docker-compose.yml) and checks it from
  # the host the way tailscale serve reaches it. Not a required check (T4.1).
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: deploy/smoke.sh
