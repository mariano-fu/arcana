openapi: 3.0.3
info:
  title: Arcana API
  version: 0.1.0
  description: Sync and backup server for the Arcana tarot practice app.
paths:
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Username + password → access and refresh tokens. Throttled (plan.md,
        Security).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '429':
          description: Throttled (`AUTH_THROTTLE_RATE`); `Retry-After` gives the seconds
            to wait.
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Refresh token → new access token and a rotated refresh token; the
        old one is blacklisted.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '429':
          description: Throttled (`AUTH_THROTTLE_RATE`); `Retry-After` gives the seconds
            to wait.
  /api/health/:
    get:
      operationId: health_retrieve
      description: Liveness + database check. The only endpoint that needs no auth
        (constitution §2).
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDown'
          description: ''
  /api/sync/:
    post:
      operationId: sync_create
      description: |-
        Push pending rows, pull the next page (specs/plan.md, "Sync protocol").

        A 400 means nothing was applied: request errors come as DRF field errors, record
        errors as `records: [{index, table, id, code, detail}]`.
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBadRequest'
          description: 'Nothing applied: per-record `records`, or DRF field errors.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
