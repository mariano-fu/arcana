        server_version:
          type: integer
          readOnly: true
        device_id:
          type: string
          format: uuid
        reading_id:
          type: string
          format: uuid
        position_index:
          type: integer
          maximum: 32767
          minimum: 0
          description: 1-based.
        card_id:
          type: string
          description: Seed card key, e.g. major-00.
        reversed:
          type: boolean
        note:
          type: string
      required:
