[project]
name = "arcana-api"
version = "0.1.0"
description = "Sync and backup server for the Arcana tarot practice app"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<6",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "factory-boy>=3.3.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "arcana.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "arcana.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    "error",
    # WhiteNoise warns when collectstatic hasn't run; tests don't need static files.
    "ignore:No directory at:UserWarning",
]
